services:
  - type: web
    name: task-manager-frontend
    runtime: static
    branch: main
    rootDir: frontend/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://task-manager-turl.onrender.com
      - key: NODE_VERSION
        value: 24.11.1
      - key: SKIP_INSTALL_DEPS
        value: "true"
